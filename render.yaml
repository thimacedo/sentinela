services:
  - type: web
    name: sentinela-api
    region: ohio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn core.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SENTINELA_ADMIN_TOTP_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  - type: worker
    name: sentinela-orchestrator
    region: ohio
    runtime: python
    buildCommand: pip install -r requirements-workers.txt && playwright install chromium
    startCommand: python main_runner.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: INSTAGRAM_SESSIONID
        sync: false
      - key: INSTAGRAM_SESSIONID_2
        sync: false
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: WATCHDOG_ACTIVE
        value: "true"
