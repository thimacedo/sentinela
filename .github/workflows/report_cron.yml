name: Relatórios Diários

on:
  schedule:
    - cron: "0 2 * * *" # Executa todos os dias às 02:00 UTC
  workflow_dispatch:

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-workers.txt

      - name: Run trends worker
        run: python workers/analytics/trends_worker.py

      - name: Run network worker
        run: python workers/analytics/network_worker.py

      - name: Commit generated reports
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/reports/*
          git commit -m "chore(reports): add daily generated reports"
          git push origin main
